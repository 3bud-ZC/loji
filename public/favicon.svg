<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="sealGrad" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#6B2834" />
      <stop offset="65%" stop-color="#491F26" />
      <stop offset="100%" stop-color="#2D1015" />
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Wax seal irregular rim -->
  <path d="M32 4 C40 3 50 8 55 15 C61 22 62 33 59 42 C56 51 49 59 39 61 C29 63 18 60 11 53 C4 46 2 35 4 25 C6 15 15 6 25 4 Z" 
        fill="url(#sealGrad)" filter="url(#softGlow)" />
  
  <!-- Subtle inner gold ring -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#D4AF37" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.75" />
  
  <!-- Calligraphic Arabic letter 'ل' (Lam) with ornamental diacritic -->
  <text x="32" y="42" font-family="'Amiri', 'Traditional Arabic', serif" font-size="32" font-weight="bold" fill="#F0E8DA" text-anchor="middle" filter="drop-shadow(0px 1px 1px rgba(0,0,0,0.6))">
    لُ
  </text>
</svg>

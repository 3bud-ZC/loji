<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="vinylBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3ECE2" />
      <stop offset="100%" stop-color="#E2D4BE" />
    </linearGradient>
    <radialGradient id="recordBody" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2B2826" />
      <stop offset="85%" stop-color="#141312" />
      <stop offset="100%" stop-color="#0A0909" />
    </radialGradient>
    <radialGradient id="centerLabel" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#6B2834" />
      <stop offset="80%" stop-color="#491F26" />
      <stop offset="100%" stop-color="#2D1015" />
    </radialGradient>
    <filter id="vinylShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="400" height="500" fill="url(#vinylBg)"/>

  <!-- Inner border -->
  <rect x="25" y="25" width="350" height="450" fill="none" stroke="#A48A62" stroke-width="0.8" opacity="0.5"/>

  <!-- Vinyl Record Graphic -->
  <g transform="translate(200, 230)" filter="url(#vinylShadow)">
    <circle cx="0" cy="0" r="140" fill="url(#recordBody)"/>

    <!-- Concentric Grooves -->
    <circle cx="0" cy="0" r="132" fill="none" stroke="#333" stroke-width="0.5" opacity="0.6"/>
    <circle cx="0" cy="0" r="124" fill="none" stroke="#222" stroke-width="0.5" opacity="0.7"/>
    <circle cx="0" cy="0" r="116" fill="none" stroke="#383838" stroke-width="0.5" opacity="0.5"/>
    <circle cx="0" cy="0" r="108" fill="none" stroke="#222" stroke-width="0.5" opacity="0.7"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="#333" stroke-width="0.5" opacity="0.6"/>
    <circle cx="0" cy="0" r="92" fill="none" stroke="#222" stroke-width="0.5" opacity="0.7"/>
    <circle cx="0" cy="0" r="84" fill="none" stroke="#383838" stroke-width="0.5" opacity="0.5"/>
    <circle cx="0" cy="0" r="76" fill="none" stroke="#222" stroke-width="0.5" opacity="0.7"/>
    <circle cx="0" cy="0" r="68" fill="none" stroke="#333" stroke-width="0.5" opacity="0.6"/>

    <!-- Light reflection shine on vinyl -->
    <path d="M-135,-30 A140,140 0 0,1 -30,-135 L-15,-65 A70,70 0 0,0 -65,-15 Z" fill="#FFF" opacity="0.04"/>
    <path d="M135,30 A140,140 0 0,1 30,135 L15,65 A70,70 0 0,0 65,15 Z" fill="#FFF" opacity="0.04"/>

    <!-- Center Label -->
    <circle cx="0" cy="0" r="52" fill="url(#centerLabel)"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.8"/>
    
    <text x="0" y="-12" font-family="'Amiri', serif" font-size="12" fill="#D4AF37" text-anchor="middle" letter-spacing="1">
      صوت الشرق
    </text>
    <text x="0" y="8" font-family="'Amiri', serif" font-size="16" font-weight="bold" fill="#F0E8DA" text-anchor="middle">
      لُـجَـيْـن
    </text>
    <text x="0" y="24" font-family="'Cormorant Garamond', serif" font-size="9" fill="#CBB48C" text-anchor="middle">
      CLASSIC 33 RPM
    </text>

    <!-- Spindle Hole -->
    <circle cx="0" cy="0" r="7" fill="#F3ECE2"/>
    <circle cx="0" cy="0" r="7" fill="none" stroke="#A48A62" stroke-width="0.8"/>
  </g>

  <!-- Caption -->
  <text x="200" y="440" font-family="'Amiri', serif" font-size="15" fill="#1C1A18" text-anchor="middle" font-style="italic">
    نغمٌ لا يشيخ • أسطوانة كلاسيكية
  </text>
</svg>

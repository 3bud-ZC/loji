<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4ECE1" />
      <stop offset="50%" stop-color="#ECE3D4" />
      <stop offset="100%" stop-color="#E2D6C3" />
    </linearGradient>
    <filter id="inkSlightGlow">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#1C1A18" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Aged Photo Background -->
  <rect width="400" height="500" fill="url(#bgPaper)"/>
  
  <!-- Subtle inner ruled manuscript border -->
  <rect x="20" y="20" width="360" height="460" fill="none" stroke="#A48A62" stroke-width="0.8" opacity="0.4"/>
  <rect x="25" y="25" width="350" height="450" fill="none" stroke="#1C1A18" stroke-width="0.4" opacity="0.3"/>

  <!-- Botanical Pressed Flower Illustration -->
  <g transform="translate(200, 240)" filter="url(#inkSlightGlow)">
    <!-- Main stem -->
    <path d="M0,170 Q-15,60 0,-80 Q10,-120 0,-150" fill="none" stroke="#535340" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Leaves -->
    <path d="M-5,40 C-35,30 -50,-10 -25,-30 C-10,-5 -5,15 -5,40 Z" fill="#535340" opacity="0.85"/>
    <path d="M3,90 C35,80 45,40 25,20 C10,40 5,65 3,90 Z" fill="#73735C" opacity="0.75"/>
    <path d="M-3,-10 C-30,-20 -40,-60 -20,-75 C-10,-55 -3,-30 -3,-10 Z" fill="#535340" opacity="0.8"/>
    <path d="M4,-40 C30,-50 35,-85 18,-100 C8,-80 4,-60 4,-40 Z" fill="#73735C" opacity="0.75"/>

    <!-- Pressed Rose/Flower Head -->
    <g transform="translate(0, -150)">
      <!-- Outer deep burgundy petals -->
      <path d="M-35,10 C-45,-20 -20,-50 0,-40 C20,-50 45,-20 35,10 C20,30 -20,30 -35,10 Z" fill="#491F26" opacity="0.9"/>
      <path d="M-25,5 C-35,-15 -15,-38 0,-30 C15,-38 35,-15 25,5 C15,20 -15,20 -25,5 Z" fill="#682C36" opacity="0.95"/>
      <!-- Inner delicate folds -->
      <path d="M-15,-5 C-20,-20 0,-30 0,-20 C0,-30 20,-20 15,-5 C10,10 -10,10 -15,-5 Z" fill="#843845"/>
      <circle cx="0" cy="-10" r="6" fill="#A48A62"/>
      <circle cx="0" cy="-10" r="3" fill="#D4AF37"/>
    </g>

    <!-- Fallen petal -->
    <path d="M40,140 C55,130 65,150 50,165 C35,165 30,150 40,140 Z" fill="#682C36" opacity="0.8"/>
  </g>

  <!-- Handwritten poetic annotation in Arabic -->
  <text x="200" y="445" font-family="'Amiri', serif" font-size="16" fill="#1C1A18" text-anchor="middle" font-style="italic" opacity="0.75">
    وردةٌ حُفظت بين السطور • لُجين
  </text>
</svg>
